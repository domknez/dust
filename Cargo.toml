[package]
name = "dust"
version = "0.1.0"
edition = "2024"
description = "Free and open source, ultra-lightweight Deezer desktop client with AirPlay 2 output"
license = "MIT"
repository = "https://github.com/domknez/dust"

[dependencies]
blowfish = "0.9"
cpal = "0.15"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
fastrand = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
md-5 = "0.10"
mdns-sd = { version = "0.13", default-features = false }
rtrb = "0.4"
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3"] }
ureq = { version = "2", features = ["json"] }
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }
if-addrs = "0.15"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
num-bigint = "0.5"
getrandom = "0.4"
zune-jpeg = "0.4"
thiserror = "2"

[features]
default = ["login-window"]
# "Log in with Deezer" webview window. Disable to drop the WebKitGTK dependency on Linux.
login-window = ["dep:tao", "dep:wry"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
symphonia = { version = "0.5", default-features = false, features = ["alac"] }

[build-dependencies]
png = "0.18"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
