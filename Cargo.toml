[package]
name = "dust"
version = "0.19.1"
edition = "2024"
description = "Free and open source, ultra-lightweight Deezer desktop client with AirPlay 2 output"
license = "MIT"
repository = "https://github.com/domknez/dust"

[dependencies]
blowfish = "0.10"
cpal = "0.18"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "links", "wayland", "x11"] }
fastrand = "2"
keyring-core = "1"
md-5 = "0.11"
mdns-sd = { version = "0.21", default-features = false }
rtrb = "0.4"
serde_json = "1"
souvlaki = "0.8"
# MP3 and FLAC for Deezer; AAC/ALAC (MP4), Vorbis (Ogg) and WAV for files on a music server.
symphonia = { version = "0.6", default-features = false, features = ["flac", "mp3", "aac", "alac", "isomp4", "ogg", "vorbis", "wav", "pcm"] }
ureq = { version = "3", features = ["json"] }
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }
if-addrs = "0.15"
sha2 = "0.11"
hkdf = "0.13"
chacha20poly1305 = "0.11"
num-bigint = "0.5"
getrandom = "0.4"
zune-jpeg = "0.4"
# Music servers send cover art as PNG or WebP too.
png = "0.18"
image-webp = "0.2"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# Keeping macOS from napping dust while it plays (audio goes to the network, so the
# system can't tell), and real-time priority for the audio threads.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[features]
default = ["login-window"]
# "Log in with Deezer" webview window. Disable to drop the WebKitGTK dependency on Linux.
login-window = ["dep:tao", "dep:wry"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
symphonia = { version = "0.6", default-features = false, features = ["alac"] }

[build-dependencies]
png = "0.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
