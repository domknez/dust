name: Release

# Push a tag matching the version in Cargo.toml (e.g. v0.1.0) to build every platform
# and publish a GitHub Release with the downloads attached. Run it by hand from the
# Actions tab for a dry run: everything is built and uploaded as workflow artifacts,
# nothing is published.
#
# macOS signing is optional. Without these secrets the app is ad-hoc signed and users
# allow it once under System Settings → Privacy & Security. With them it is signed
# with your Developer ID and notarized:
#   MACOS_CERTIFICATE           base64 of the "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD  its export password
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD  for notarization (app-specific password)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS (universal)
    needs: version
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -hex 16)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build, sign and package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg

  linux:
    name: Linux (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          name="dust-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/dust README.md LICENSE assets/linux/dust.desktop "dist/$name/"
          cp assets/dust-icon-pack/png/dust-256.png "dist/$name/dust.png"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          name="dust-${{ needs.version.outputs.version }}-windows-x64"
          mkdir -p "dist/$name"
          cp target/release/dust.exe README.md LICENSE "dist/$name/"
          cd dist && 7z a "$name.zip" "$name" >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip

  release:
    name: publish
    needs: [version, macos, linux, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "dust ${{ needs.version.outputs.version }}" \
            --notes-file .github/release-notes.md \
            --generate-notes
