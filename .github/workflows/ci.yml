name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Release commits made by the Auto release workflow only bump the version and the
# changelog of code CI already checked in the pull request, so their jobs are skipped.
jobs:
  lint:
    name: fmt + clippy
    if: github.event_name != 'push' || github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Downloaded packages are kept between runs (per runner image, refreshed
      # monthly), so a stalling package mirror only matters for what changed.
      - name: Cache key
        id: key
        run: echo "apt=apt-$ImageOS-${{ runner.arch }}" >> "$GITHUB_OUTPUT"; echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache system packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: ${{ steps.key.outputs.apt }}-${{ steps.key.outputs.month }}
          restore-keys: ${{ steps.key.outputs.apt }}-
      - name: System libraries
        timeout-minutes: 25
        run: |
          # The runners' package mirror sometimes trickles a package for minutes: time
          # out each try and retry on another mirror (partial downloads carry over).
          mkdir -p ~/apt-archives/partial
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives"
          for mirror in "" http://archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/; do
            [ -n "$mirror" ] && echo "$mirror" | sudo tee /etc/apt/apt-mirrors.txt
            timeout 120 $apt update && timeout 420 $apt install -y libasound2-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev pkg-config && sudo chown -R "$(id -u)" ~/apt-archives && exit 0
            echo "apt failed on ${mirror:-the default mirror}"; sleep 10
          done
          exit 1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'push' || github.event.head_commit.author.name != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Downloaded packages are kept between runs (per runner image, refreshed
      # monthly), so a stalling package mirror only matters for what changed.
      - name: Cache key
        if: runner.os == 'Linux'
        id: key
        run: echo "apt=apt-$ImageOS-${{ runner.arch }}" >> "$GITHUB_OUTPUT"; echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache system packages
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: ${{ steps.key.outputs.apt }}-${{ steps.key.outputs.month }}
          restore-keys: ${{ steps.key.outputs.apt }}-
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: |
          # The runners' package mirror sometimes trickles a package for minutes: time
          # out each try and retry on another mirror (partial downloads carry over).
          mkdir -p ~/apt-archives/partial
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives"
          for mirror in "" http://archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/; do
            [ -n "$mirror" ] && echo "$mirror" | sudo tee /etc/apt/apt-mirrors.txt
            timeout 120 $apt update && timeout 420 $apt install -y libasound2-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev pkg-config && sudo chown -R "$(id -u)" ~/apt-archives && exit 0
            echo "apt failed on ${mirror:-the default mirror}"; sleep 10
          done
          exit 1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
